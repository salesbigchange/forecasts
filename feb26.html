                                            itemStyle={{color: '#fff'}}
                                        />
                                        <Legend wrapperStyle={{paddingTop: '10px'}} />
                                        <Bar dataKey="best" name="Best Case" fill="#28E289" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="forecast" name="Forecast" fill="#0072CE" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="commit" name="Commit" fill="#0A2240" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Detailed Table */}
                        <div className="bg-white rounded-xl card-shadow overflow-hidden mb-12">
                            <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                <h3 className="text-lg font-bold text-bc-navy">Key Opportunities & Forecast Items</h3>
                                <span className="text-xs bg-bc-blue text-white px-3 py-1 rounded-full">Feb 2026</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                            <th className="p-4 font-medium border-b">Deal Name</th>
                                            <th className="p-4 font-medium border-b cursor-pointer hover:text-bc-blue" onClick={() => requestSort('owner')}>
                                                Owner {sortConfig.key === 'owner' && (sortConfig.direction === 'ascending' ? '▲' : '▼')}
                                            </th>
                                            <th className="p-4 font-medium border-b cursor-pointer hover:text-bc-blue" onClick={() => requestSort('amount')}>
                                                Amount {sortConfig.key === 'amount' && (sortConfig.direction === 'ascending' ? '▲' : '▼')}
                                            </th>
                                            <th className="p-4 font-medium border-b">Stage</th>
                                            <th className="p-4 font-medium border-b">Forecast Category</th>
                                            <th className="p-4 font-medium border-b">Close Date</th>
                                            <th className="p-4 font-medium border-b text-center">Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm text-bc-charcoal divide-y divide-gray-100">
                                        {deals.map((deal) => (
                                            <tr key={deal.id} className="hover:bg-blue-50 transition-colors">
                                                <td className="p-4 font-semibold text-bc-navy">{deal.name}</td>
                                                <td className="p-4 flex items-center gap-2">
                                                    <div className="w-6 h-6 rounded-full bg-gray-200 text-xs flex items-center justify-center text-gray-600 font-bold">
                                                        {deal.owner.charAt(0)}
                                                    </div>
                                                    {deal.owner}
                                                </td>
                                                <td className="p-4 font-bold text-bc-navy">£{deal.amount.toLocaleString()}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-medium 
                                                        ${deal.stage === 'Contract' ? 'bg-green-100 text-green-700' : 
                                                          deal.stage === 'Qualification' || deal.stage === 'Scope' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                                                        {deal.stage}
                                                    </span>
                                                </td>
                                                <td className="p-4">{deal.probability}</td>
                                                <td className="p-4 text-gray-500">{new Date(deal.closeDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})}</td>
                                                <td className="p-4 text-center relative tooltip-container">
                                                    <Info className="w-5 h-5 text-gray-400 hover:text-bc-blue cursor-help mx-auto" />
                                                    <div className="tooltip-custom">
                                                        <div className="tooltip-arrow"></div>
                                                        <p className="font-bold mb-1 text-bc-green">Manager Note:</p>
                                                        {deal.notes}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-gray-50">
                                        <tr>
                                            <td colSpan="2" className="p-4 text-right font-bold text-bc-navy">Visible Pipeline:</td>
                                            <td className="p-4 font-bold text-bc-blue text-lg">£{deals.reduce((sum, item) => sum + item.amount, 0).toLocaleString()}</td>
                                            <td colSpan="4" className="p-4 text-gray-400 italic text-xs">Note: Forecast KPI is set at £50k per management call, exceeding visible deal sum.</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                         {/* Committed Deals Table (NEW SECTION) */}
                         <div className="bg-white rounded-xl card-shadow overflow-hidden mb-12">
                            <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-bc-navy text-white">
                                <h3 className="text-lg font-bold">Committed Deals - Detailed View</h3>
                                <span className="text-xs bg-bc-blue px-3 py-1 rounded-full">Pipeline Review</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                            <th className="p-4 font-medium border-b w-1/6">Deal Name</th>
                                            <th className="p-4 font-medium border-b">Owner</th>
                                            <th className="p-4 font-medium border-b w-1/3">Manager Notes</th>
                                            <th className="p-4 font-medium border-b">Commit</th>
                                            <th className="p-4 font-medium border-b">Amount</th>
                                            <th className="p-4 font-medium border-b">Licences</th>
                                            <th className="p-4 font-medium border-b">Stage</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm text-bc-charcoal divide-y divide-gray-100">
                                        {committedDealsData.map((deal, idx) => (
                                            <tr key={idx} className="hover:bg-blue-50 transition-colors">
                                                <td className="p-4 font-bold text-bc-navy">{deal.name}</td>
                                                <td className="p-4 whitespace-nowrap">{deal.owner}</td>
                                                <td className="p-4 text-xs text-gray-600 leading-relaxed">
                                                    {deal.notes}
                                                </td>
                                                <td className="p-4">
                                                     <span className="px-2 py-1 rounded-md text-xs font-bold bg-green-100 text-green-700">
                                                        {deal.commit}
                                                     </span>
                                                </td>
                                                <td className="p-4 font-semibold">£{deal.amount.toLocaleString()}</td>
                                                <td className="p-4 text-center">{deal.licenses}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-medium 
                                                        ${deal.stage === 'Consensus' || deal.stage === 'Validate' ? 'bg-bc-blue text-white' : 
                                                          'bg-gray-100 text-gray-600'}`}>
                                                        {deal.stage}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-gray-50">
                                        <tr>
                                            <td colSpan="4" className="p-4 text-right font-bold text-bc-navy">Total Committed Value:</td>
                                            <td colSpan="3" className="p-4 font-bold text-bc-blue text-lg">
                                                £{committedDealsData.reduce((sum, item) => sum + item.amount, 0).toLocaleString()}
                                            </td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-4 text-center text-gray-400 text-xs py-8">
                        <p>&copy; 2026 BigChange. Confidential Forecast Data. Generated for Internal Review.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
