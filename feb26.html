<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigChange | Feb 2026 Forecast</title>
    
    <!-- Console Warning Suppression for Recharts defaultProps -->
    <script>
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('Support for defaultProps will be removed')) {
                return;
            }
            originalConsoleError(...args);
        };
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Prop-types (Required for Recharts UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (Pinned to Stable v2.12.0) -->
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    
    <!-- Brand Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bc: {
                            blue: '#0072CE',    // Energy Blue
                            navy: '#0A2240',    // Navy
                            grey: '#F4F4F4',    // Light Grey
                            charcoal: '#282922', // Charcoal
                            green: '#28E289',   // Green
                            orange: '#FF6B00',  // Orange
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F4F4F4; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .tooltip-custom {
            visibility: hidden;
            position: absolute;
            z-index: 50;
            width: 300px;
            background-color: #0A2240;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.85rem;
            bottom: 125%;
            left: 50%;
            margin-left: -150px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tooltip-container:hover .tooltip-custom {
            visibility: visible;
            opacity: 1;
        }
        .tooltip-arrow {
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #0A2240 transparent transparent transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell, PieChart, Pie } = Recharts;
        
        // --- INLINE ICON COMPONENTS ---
        const Info = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        );

        const TrendingUp = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const AlertCircle = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const CheckCircle = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );

        const Target = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </svg>
        );


        // --- DATA SOURCING ---
        
        // 1. DEAL LIST (Original Excel + Talk Track)
        const dealData = [
            { 
                id: 1, 
                name: "Blackwood Quarry Eng Ltd", 
                owner: "Emilio Lavia", 
                amount: 400, 
                stage: "Qualification", 
                closeDate: "2026-02-28", 
                probability: "Commit",
                notes: "50/50 whether this will be a goer. Catch up on 13th Feb. Need to push for end of month." 
            },
            { 
                id: 2, 
                name: "Drain Detectives", 
                owner: "Oliver Abrahamson", 
                amount: 4500, 
                stage: "Qualification", 
                closeDate: "2026-02-19", 
                probability: "Best Case",
                notes: "Olly on site 19/02. Customer uses Lanes currently. Engineers used to app. Strong potential." 
            },
            { 
                id: 3, 
                name: "Flo-Gas", 
                owner: "Arab/Serge", 
                amount: 12000, 
                stage: "Scope", 
                closeDate: "2026-02-25", 
                probability: "Best Case",
                notes: "MUST WIN. Serge working with Arab. Key to delivering the delta." 
            },
            { 
                id: 4, 
                name: "Aerial Platforms Ltd", 
                owner: "Eli", 
                amount: 8500, 
                stage: "Scope", 
                closeDate: "2026-02-27", 
                probability: "Best Case",
                notes: "Recent deal, trying to accelerate. Must win for Eli." 
            },
            { 
                id: 6, 
                name: "Create & Close (In Month)", 
                owner: "Team", 
                amount: 15000, 
                stage: "Run Rate", 
                closeDate: "2026-02-28", 
                probability: "Forecast",
                notes: "Historical trend indicates ~15k run rate. Some already seen." 
            }
        ];

        // 2. REP DATA (From AdditionalDashboardData.xlsx)
        // Logic: Using the latest non-empty week data for each rep to show current standing.
        const repPerformanceData = [
            { name: "Arab Ismail", best: 8000, forecast: 5500, commit: 5000, closed: 0 }, // Week 1 (Latest available)
            { name: "Emilio Lavia", best: 4000, forecast: 3000, commit: 2700, closed: 0 }, // Week 1
            { name: "Eli Sufrin", best: 6169, forecast: 1169, commit: 700, closed: 0 }, // Week 2
            { name: "Harris Tarriq", best: 1500, forecast: 800, commit: 300, closed: 170 }, // Week 2
            { name: "Oliver Abrahamson", best: 10000, forecast: 7000, commit: 4000, closed: 0 }, // Week 1
            { name: "Edan Poole", best: 1500, forecast: 500, commit: 300, closed: 0 }, // Week 1
            { name: "Ellis Whelan", best: 3900, forecast: 3700, commit: 2483, closed: 2103 }, // Week 2
        ];

        // --- COMPONENTS ---

        const KpiCard = ({ title, value, subtitle, icon: Icon, trend }) => (
            <div className="bg-white p-6 rounded-xl card-shadow border-l-4 border-bc-blue flex flex-col justify-between">
                <div className="flex justify-between items-start mb-2">
                    <div>
                        <h3 className="text-bc-navy text-sm font-bold uppercase tracking-wider">{title}</h3>
                        <div className="text-3xl font-bold text-bc-blue mt-1">{value}</div>
                    </div>
                    <div className="p-2 bg-bc-grey rounded-full">
                        <Icon size={20} className="text-bc-navy" />
                    </div>
                </div>
                <div className="flex items-center text-sm">
                    {trend && (
                        <span className={`font-semibold mr-2 ${trend === 'negative' ? 'text-bc-orange' : 'text-bc-green'}`}>
                            {subtitle.split(' ')[0]}
                        </span>
                    )}
                    <span className="text-gray-500">{trend ? subtitle.substring(subtitle.indexOf(' ') + 1) : subtitle}</span>
                </div>
            </div>
        );

        const Dashboard = () => {
            const [deals, setDeals] = React.useState(dealData);
            const [sortConfig, setSortConfig] = React.useState({ key: 'amount', direction: 'desc' });

            // Sort handler
            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });

                const sortedDeals = [...deals].sort((a, b) => {
                    if (a[key] < b[key]) return direction === 'ascending' ? -1 : 1;
                    if (a[key] > b[key]) return direction === 'ascending' ? 1 : -1;
                    return 0;
                });
                setDeals(sortedDeals);
            };

            // Chart Data Construction
            const target = 68656;
            const closed = 8257;
            const forecast = 50000; 
            const bestCase = 55000;
            
            const overviewChartData = [
                { name: 'Closed', value: closed, fill: '#0A2240' }, // Navy
                { name: 'Forecast', value: forecast, fill: '#0072CE' }, // Energy Blue
                { name: 'Best Case', value: bestCase, fill: '#28E289' }, // Green
                { name: 'Target', value: target, fill: '#282922' }, // Charcoal
            ];

            return (
                <div className="min-h-screen pb-12">
                    {/* Navigation / Header */}
                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-24">
                                <div className="flex items-center w-full">
                                    <img 
                                        src="https://cdn.prod.website-files.com/652cf498161daabd6b40ba1b/67ab22b71528288604bc325e_BigChange-Horz_RGB_EnergyBlue.svg" 
                                        alt="BigChange Logo" 
                                        className="h-14"
                                    />
                                    <div className="ml-8 flex flex-col justify-center">
                                        <span className="text-3xl font-extrabold text-bc-navy tracking-tight">February 2026 Forecast</span>
                                        <span className="text-sm text-gray-500 font-bold tracking-widest uppercase mt-1">Commercial Revenue Operations</span>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
                        
                        {/* KPI Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            <KpiCard 
                                title="Closed Revenue" 
                                value="£8,257" 
                                subtitle="12% of Target Attained"
                                trend="negative"
                                icon={CheckCircle} 
                            />
                            <KpiCard 
                                title="Forecast Commit" 
                                value="£50,000" 
                                subtitle="£18,656 Shortfall to Target"
                                trend="negative"
                                icon={TrendingUp} 
                            />
                            <KpiCard 
                                title="Weighted Forecast" 
                                value="£18,540" 
                                subtitle="Requires £31.5k bridge"
                                trend="neutral"
                                icon={AlertCircle} 
                            />
                            <KpiCard 
                                title="Month Target" 
                                value="£68,656" 
                                subtitle="Sales Target"
                                trend="neutral"
                                icon={Target} 
                            />
                        </div>

                        {/* Executive Summary & Charts Section */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                            
                            {/* Executive Summary (Talk Track) */}
                            <div className="bg-white rounded-xl card-shadow p-6 lg:col-span-2 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-2 h-full bg-bc-orange"></div>
                                <h3 className="text-lg font-bold text-bc-navy mb-4 flex items-center">
                                    <Info className="w-5 h-5 mr-2 text-bc-blue" />
                                    Executive Summary
                                </h3>
                                <div className="prose text-gray-700 text-sm leading-relaxed">
                                    <p className="mb-3">
                                        We are calling a <strong>Best Case of £55,000</strong> and <strong>Forecast of £50,000</strong>. 
                                        While currently at 12% of target (£8,257 closed), we lack the total pipeline coverage to hit the full £68k target comfortably.
                                    </p>
                                    <div className="bg-bc-grey p-4 rounded-lg border border-gray-200 mb-3">
                                        <h4 className="font-bold text-bc-navy mb-2 text-xs uppercase">Strategy & Gap Closure</h4>
                                        <ul className="list-disc pl-5 space-y-1">
                                            <li><strong>Create & Close:</strong> Banking on ~£15k in-month run rate (historical avg).</li>
                                            <li><strong>Key Deals:</strong> <span className="text-bc-blue font-bold">Flo-Gas (£12k)</span> is a must-win to bridge the weighted gap. Serge working closely with Arab.</li>
                                            <li><strong>Team Dynamics:</strong> Serge's pipeline redistributed. Olly holds the lion's share (£14k) including larger deals that need speed. Arab tracking to over-deliver.</li>
                                        </ul>
                                    </div>
                                    <p className="italic text-gray-500 text-xs">
                                        "We are over our skis but will move heaven and earth to get there."
                                    </p>
                                </div>
                            </div>

                            {/* Charts Column */}
                            <div className="flex flex-col gap-6">
                                {/* Waterfall / Bar Chart */}
                                <div className="bg-white rounded-xl card-shadow p-6 flex-1">
                                    <h3 className="text-sm font-bold text-bc-navy mb-4">Forecast vs Target</h3>
                                    <div className="h-48">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={overviewChartData} layout="vertical" margin={{top: 5, right: 30, left: 20, bottom: 5}}>
                                                <XAxis type="number" hide />
                                                <YAxis dataKey="name" type="category" width={80} tick={{fontSize: 12}} />
                                                <Tooltip formatter={(value) => `£${value.toLocaleString()}`} cursor={{fill: 'transparent'}} />
                                                <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                                                    {overviewChartData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.fill} />
                                                    ))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Team Performance Chart (NEW) */}
                         <div className="bg-white rounded-xl card-shadow p-6 mb-8">
                            <h3 className="text-lg font-bold text-bc-navy mb-6">Team Forecast Performance (Current)</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={repPerformanceData} margin={{top: 20, right: 30, left: 0, bottom: 5}}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="name" tick={{fontSize: 11}} interval={0} />
                                        <YAxis tick={{fontSize: 12}} />
                                        <Tooltip 
                                            formatter={(value) => `£${value.toLocaleString()}`}
                                            contentStyle={{backgroundColor: '#0A2240', color: '#fff', border: 'none', borderRadius: '6px'}}
                                            itemStyle={{color: '#fff'}}
                                        />
                                        <Legend wrapperStyle={{paddingTop: '10px'}} />
                                        <Bar dataKey="best" name="Best Case" fill="#28E289" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="forecast" name="Forecast" fill="#0072CE" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="commit" name="Commit" fill="#0A2240" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Detailed Table */}
                        <div className="bg-white rounded-xl card-shadow overflow-hidden mb-12">
                            <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                <h3 className="text-lg font-bold text-bc-navy">Key Opportunities & Forecast Items</h3>
                                <span className="text-xs bg-bc-blue text-white px-3 py-1 rounded-full">Feb 2026</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                            <th className="p-4 font-medium border-b">Deal Name</th>
                                            <th className="p-4 font-medium border-b cursor-pointer hover:text-bc-blue" onClick={() => requestSort('owner')}>
                                                Owner {sortConfig.key === 'owner' && (sortConfig.direction === 'ascending' ? '▲' : '▼')}
                                            </th>
                                            <th className="p-4 font-medium border-b cursor-pointer hover:text-bc-blue" onClick={() => requestSort('amount')}>
                                                Amount {sortConfig.key === 'amount' && (sortConfig.direction === 'ascending' ? '▲' : '▼')}
                                            </th>
                                            <th className="p-4 font-medium border-b">Stage</th>
                                            <th className="p-4 font-medium border-b">Forecast Category</th>
                                            <th className="p-4 font-medium border-b">Close Date</th>
                                            <th className="p-4 font-medium border-b text-center">Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm text-bc-charcoal divide-y divide-gray-100">
                                        {deals.map((deal) => (
                                            <tr key={deal.id} className="hover:bg-blue-50 transition-colors">
                                                <td className="p-4 font-semibold text-bc-navy">{deal.name}</td>
                                                <td className="p-4 flex items-center gap-2">
                                                    <div className="w-6 h-6 rounded-full bg-gray-200 text-xs flex items-center justify-center text-gray-600 font-bold">
                                                        {deal.owner.charAt(0)}
                                                    </div>
                                                    {deal.owner}
                                                </td>
                                                <td className="p-4 font-bold text-bc-navy">£{deal.amount.toLocaleString()}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-medium 
                                                        ${deal.stage === 'Contract' ? 'bg-green-100 text-green-700' : 
                                                          deal.stage === 'Qualification' || deal.stage === 'Scope' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                                                        {deal.stage}
                                                    </span>
                                                </td>
                                                <td className="p-4">{deal.probability}</td>
                                                <td className="p-4 text-gray-500">{new Date(deal.closeDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})}</td>
                                                <td className="p-4 text-center relative tooltip-container">
                                                    <Info className="w-5 h-5 text-gray-400 hover:text-bc-blue cursor-help mx-auto" />
                                                    <div className="tooltip-custom">
                                                        <div className="tooltip-arrow"></div>
                                                        <p className="font-bold mb-1 text-bc-green">Manager Note:</p>
                                                        {deal.notes}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-gray-50">
                                        <tr>
                                            <td colSpan="2" className="p-4 text-right font-bold text-bc-navy">Visible Pipeline:</td>
                                            <td className="p-4 font-bold text-bc-blue text-lg">£{deals.reduce((sum, item) => sum + item.amount, 0).toLocaleString()}</td>
                                            <td colSpan="4" className="p-4 text-gray-400 italic text-xs">Note: Forecast KPI is set at £50k per management call, exceeding visible deal sum.</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-4 text-center text-gray-400 text-xs py-8">
                        <p>&copy; 2026 BigChange. Confidential Forecast Data. Generated for Internal Review.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
